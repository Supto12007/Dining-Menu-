<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secret Message</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    font-family:'Hind Siliguri',sans-serif;
}

/* Mystery Box */

.box{
    width:200px;
    height:200px;
    background:linear-gradient(145deg,#f4b400,#d48806);
    border-radius:18px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    font-size:26px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 20px gold,0 0 60px orange;
    animation:glow 2s infinite;
    transition:.4s;
}

.box:hover{
    transform:scale(1.08) rotateY(10deg);
}

@keyframes glow{
    50%{
        box-shadow:0 0 45px yellow,0 0 90px orange;
    }
}

/* Letter */

.letter{
    display:none;
    width:90%;
    max-width:650px;
    min-height:350px;
    background:white;
    border-radius:18px;
    padding:35px;
    box-shadow:0 0 30px rgba(0,0,0,.5);
    animation:openLetter .8s;
}

@keyframes openLetter{
    from{
        transform:scale(.5);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

h1{
    color:#d35400;
    text-align:center;
    margin-bottom:25px;
    font-size:30px;
}

#text{
    font-size:22px;
    line-height:1.8;
    color:#222;
    white-space:pre-wrap;
}

</style>

</head>

<body>

<div class="box" id="box" onclick="openBox()">
😋<br>
Open to See Menu
</div>

<div class="letter" id="letter">

<h1 id="heading"></h1>

<p id="text"></p>

</div>

<script>

let heading =
"১১.০৮.২৬(মঙ্গলবার)_দুপুর";

let message =
`আজকের মেনু:
১)ভাত
২)ডাল
৩)মুরগী/নারিকেলি 
৪)মিক্স সবজি 

~সুপ্ত-রাফি ডাইনিং সমাচার`;

let i=0;

function openBox(){

    document.getElementById("box").style.display="none";

    document.getElementById("letter").style.display="block";

    document.getElementById("heading").innerHTML=heading;

    typeWriter();

}

function typeWriter(){

    if(i<message.length){

        document.getElementById("text").innerHTML += message.charAt(i);

        i++;

        setTimeout(typeWriter,40);

    }

}

</script>

</body>
</html>
