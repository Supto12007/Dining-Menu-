<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mystery Message</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI', sans-serif;

    background:
    linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
    url("https://images.unsplash.com/photo-1516321318423-f06f85e504b3");

    background-size:cover;
    background-position:center;
}


/* Mystery Box */

.box{
    width:200px;
    height:200px;
    background:#e6a11a;
    border-radius:15px;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    font-size:25px;
    text-align:center;

    cursor:pointer;

    box-shadow:
    0 0 20px gold,
    0 0 50px orange;

    animation:glow 2s infinite;
    
    transform-style:preserve-3d;
}


@keyframes glow{

    50%{
        box-shadow:
        0 0 50px yellow,
        0 0 90px orange;
    }

}


.box:hover{
    transform:rotateY(15deg) scale(1.1);
}



/* Letter */

.letter{

    display:none;

    background:white;
    width:350px;
    min-height:250px;

    padding:30px;

    border-radius:15px;

    text-align:center;

    box-shadow:0 0 30px black;

    animation:openLetter 1s;

}


@keyframes openLetter{

    from{
        transform:scale(0);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}



h1{

    color:#d35400;
    margin-bottom:20px;

}


#text{

    font-size:18px;
    line-height:1.6;

}



</style>

</head>


<body>


<div class="box" id="box" onclick="openBox()">

🎁<br>
Open Me

</div>



<div class="letter" id="letter">

<h1>💌 A Secret Message</h1>

<p id="text"></p>


</div>



<!-- Sound -->

<audio id="sound">

<source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3">

</audio>



<script>


let message = 
"YOUR MESSAGE HERE";


let i=0;



function openBox(){


    // Play sound

    document.getElementById("sound").play();



    // Hide box

    document.getElementById("box").style.display="none";



    // Show letter

    document.getElementById("letter").style.display="block";



    // Typing effect

    typeWriter();


}



function typeWriter(){


    if(i < message.length){

        document.getElementById("text").innerHTML += message.charAt(i);

        i++;

        setTimeout(typeWriter,70);

    }


}


</script>


</body>

</html>
